[project]
name = "morj"
version = "1.2.1"
description = "MORJ (Multi-Order Rotation Judge): zero-shot structured decisions from stock Gemma 4 31B on TensorRT-LLM, read from next-token distributions over several orders of the options."
requires-python = ">=3.11"
license = "Apache-2.0"
# The service runs inside NVIDIA's TensorRT-LLM 1.3.0rc29 release image, which provides
# tensorrt_llm, torch, transformers, fastapi, uvicorn and prometheus_client.

[project.optional-dependencies]
test = ["pytest", "httpx", "fastapi", "pydantic>=2", "prometheus_client", "transformers>=5", "jinja2", "huggingface_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
